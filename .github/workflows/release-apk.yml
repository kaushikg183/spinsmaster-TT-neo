name: Build & Publish Public SpinMaster-TT APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Web App Files
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Wrap HTML into Android Project via Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon.svg www/
          echo '{"name":"spinmaster-tt-neon","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "SpinMaster TT" "com.kaushikg183.spinmastertt" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for 1-Tap Link
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SpinMaster-TT.apk

      - name: Publish Public APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: SpinMaster TT Neon (Latest Android APK)
          body: |
            ### 🏓 Direct 1-Tap Android Download
            Tap **SpinMaster-TT.apk** below to install directly on Android without signing into GitHub.
          files: SpinMaster-TT.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
